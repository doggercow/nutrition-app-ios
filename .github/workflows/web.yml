name: Web

# Builds the Flutter web app and, on main, publishes it to GitHub Pages at
# https://danieldacool.github.io/nutrition-app/. Separate from ci.yml, which
# keeps doing codegen check, analyze, test and the Android APK.
#
# A fork can publish its own copy at https://<owner>.github.io/<repo>/ by
# enabling Pages (source: GitHub Actions) and setting the repository variable
# DEPLOY_PAGES to "true".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: web-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      # Pages serves the site from /<repository name>/, not the domain root.
      # No USDA_API_KEY here: anything passed by --dart-define is readable in
      # the public JS bundle, so the web build uses the DEMO_KEY default.
      # NEW_FEATURES_OPT_IN: a repository that sets this variable to "true"
      # gets new Feature hub features switched off until the user turns them
      # on (see lib/core/app_features.dart). Unset means on, as usual.
      - name: Build web
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=NEW_FEATURES_OPT_IN=${{ vars.NEW_FEATURES_OPT_IN == 'true' }}

      - name: Upload Pages artifact (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  # Pull requests (including from forks) stop after the build above. Only
  # main deploys, in this repository or in a fork that opted in.
  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (github.repository == 'DanielDaCool/nutrition-app' ||
      vars.DEPLOY_PAGES == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
