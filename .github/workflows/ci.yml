name: CI

# Every push to main and every pull request: codegen check, analyze, test,
# and an APK as a downloadable artifact. Friends only get a new APK from a
# version tag (v0.1, ...): that run attaches it to the tag's GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      # Sets APP_VERSION; on a tag, fails unless the tag matches pubspec.yaml.
      - name: Read app version
        run: .github/scripts/app-version.sh

      - name: Check generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up release signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the release signing key."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APK is signed with a throwaway debug key and cannot be installed over a previous build."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          REPORT_RELAY_URL: ${{ secrets.REPORT_RELAY_URL }}
        run: >-
          flutter build apk --release
          --dart-define=USDA_API_KEY="${USDA_API_KEY:-DEMO_KEY}"
          --dart-define=APP_VERSION="$APP_VERSION"
          --dart-define=REPORT_RELAY_URL="$REPORT_RELAY_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: nutrition-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # The release may already exist (made on GitHub with release notes);
      # then only the APK is added or replaced. Otherwise it's created with
      # notes generated from the merged pull requests.
      - name: Attach APK to the version's release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk nutrition.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" nutrition.apk --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" nutrition.apk \
              --verify-tag --title "$TAG" --generate-notes --latest
          fi
